name: Upstream validation
run-name: "Upstream v7.2.10 validation · 96895c81ec7d71d77aa074a2589407ddb4ca091c"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-7.2.10-validation
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # arm64 的镜像尚未适配，先并行跑起来看结果，通过前不阻塞发布
    continue-on-error: ${{ matrix.arch != 'x64' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            updater: tlinuxupd
          - arch: arm64
            runner: ubuntu-24.04-arm
            updater: tlinuxarmupd
    timeout-minutes: 359

    env:
      IMAGE_TAG: ayugram:centos_env
      # 每个架构为完整依赖缓存（镜像层 + mount）预留 2 GiB。
      # 应用 ccache 的 3G 为十进制；双架构总预算约 9.59 GiB，保留约 0.41 GiB 余量。
      CCACHE_MAXSIZE: 3G

    steps:
      - name: Validate dispatcher.
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "KiritoXDone"

      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          repository: Kindness-Kismet/AstraGram-Desktop
          ref: 96895c81ec7d71d77aa074a2589407ddb4ca091c
          submodules: recursive
          persist-credentials: false

      - name: Validate pinned test source.
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "KiritoXDone"
          test "$(git rev-parse HEAD)" = "96895c81ec7d71d77aa074a2589407ddb4ca091c"
          git submodule status --recursive

      - name: Check packer cache guard.
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; assert b'ccache:disable' in Path('Telegram/SourceFiles/_other/packer.cpp').read_bytes()[:4096]"

      - name: First set up.
        run: |
          set -euo pipefail
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          ccache_arch=$(uname -m)
          curl -sSL "https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-${ccache_arch}-glibc.tar.xz" \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 "ccache-4.13.6-linux-${ccache_arch}-glibc/ccache"
          echo "CCACHE_DIR=$RUNNER_TEMP/.ayugram-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          # 正式版：DEBUG 与 LTO 均关闭
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up disk space.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Check out cache maintenance scripts.
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .builder-ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Restore libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ matrix.arch }}-mounts-v2-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-${{ matrix.arch }}-

      # 显式调用官方 CLI，让 mount 导出发生在依赖缓存上传之前。
      - name: Check out cache dance CLI.
        uses: actions/checkout@v7
        with:
          repository: reproducible-containers/buildkit-cache-dance
          ref: v3.4.0
          path: .buildkit-cache-dance
          sparse-checkout: dist
          persist-credentials: false

      - name: Restore Docker cache mounts.
        env:
          BUILDER: ${{ steps.setup-buildx.outputs.name }}
          MOUNT_CACHE_MAP: '{"${{ runner.temp }}/.mount-cache/var/cache/ccache":"/var/cache/ccache"}'
        run: |
          node .buildkit-cache-dance/dist/index.js \
            --builder "$BUILDER" --cache-map "$MOUNT_CACHE_MAP" \
            --scratch-dir "$RUNNER_TEMP/cache-dance"

      - name: Build dependencies.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          set -euo pipefail
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Export Docker cache mounts.
        id: export-mounts
        continue-on-error: true
        if: steps.cache-libs.outputs.cache-hit != 'true'
        env:
          BUILDER: ${{ steps.setup-buildx.outputs.name }}
          MOUNT_CACHE_MAP: '{"${{ runner.temp }}/.mount-cache/var/cache/ccache":"/var/cache/ccache"}'
        run: |
          set -euo pipefail
          node .buildkit-cache-dance/dist/index.js --extract \
            --builder "$BUILDER" --cache-map "$MOUNT_CACHE_MAP" \
            --scratch-dir "$RUNNER_TEMP/cache-dance"
          # 384M 只限制依赖编译的 ccache，包含在上述 2 GiB 预算内，不裁剪镜像层。
          CCACHE_DIR="$RUNNER_TEMP/.mount-cache/var/cache/ccache" \
            CCACHE_MAXSIZE=384M ccache --cleanup

      # 不再归档下载缓存；保留依赖镜像层和有容量限制的编译 mount。
      - name: Prepare dependency cache paths.
        run: |
          mkdir -p "$RUNNER_TEMP/.mount-cache/var/cache/ccache"
          rm -rf "$RUNNER_TEMP/.mount-cache/var/cache/dnf"

      - name: Prepare libraries cache update.
        id: prepare-libs
        if: steps.export-mounts.outcome == 'success' || steps.cache-libs.outputs.cache-hit == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ runner.OS }}-libs-${{ matrix.arch }}-
          CURRENT_KEY: ${{ steps.cache-libs.outputs.cache-primary-key }}
        run: |
          python3 .builder-ci/.github/scripts/prepare_cache_save.py \
            --prefix "$CACHE_PREFIX" --key "$CURRENT_KEY" \
            "$RUNNER_TEMP/.buildx-cache"

      - name: Save libraries cache.
        if: steps.prepare-libs.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Restore build cache.
        id: cache-build
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-ayugram-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.OS }}-ayugram-${{ matrix.arch }}-

      # Packer 是 Telegram 的构建依赖，私钥头文件必须在编译前就位
      - name: Write packer signing key.
        env:
          PACKER_PRIVATE_H: ${{ secrets.PACKER_PRIVATE_H }}
        run: |
          set -euo pipefail
          test -n "$PACKER_PRIVATE_H"
          printf '%s' "$PACKER_PRIVATE_H" > Telegram/SourceFiles/_other/packer_private.h

      - name: Build AstraGram Desktop.
        run: |
          set -euo pipefail
          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          -e CCACHE_MAXSIZE \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D TDESKTOP_API_ID=2040 \
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          -D AYUGRAM_BUILD_PACKER=ON

      - name: Count ccache misses.
        id: ccache-stats
        run: |
          set -euo pipefail
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Enforce compiler cache budget.
        run: ccache --cleanup

      - name: Prepare compiler cache update.
        id: prepare-ccache
        if: github.ref_name == github.event.repository.default_branch && fromJSON(steps.ccache-stats.outputs.misses) > 300
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ${{ runner.OS }}-ayugram-${{ matrix.arch }}-
          CURRENT_KEY: ${{ steps.cache-build.outputs.cache-primary-key }}
        run: |
          python3 .builder-ci/.github/scripts/prepare_cache_save.py \
            --prefix "$CACHE_PREFIX" --key "$CURRENT_KEY" \
            "$CCACHE_DIR"

      - name: Save build cache.
        if: steps.prepare-ccache.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Check release output.
        run: |
          set -euo pipefail
          filePath="out/Release/AstraGram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"
            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Package release output.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^AppVersionStrSmall //p' Telegram/build/version)
          test -n "$version"
          cd out/Release
          rm -f "AstraGram-v${version}-linux-${{ matrix.arch }}.zip"
          zip "AstraGram-v${version}-linux-${{ matrix.arch }}.zip" AstraGram
          test ! -f Updater || zip "AstraGram-v${version}-linux-${{ matrix.arch }}.zip" Updater

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: Test-Upstream-7.2.10-96895c81ec-AstraGram-Linux-${{ matrix.arch }}
          path: |
            out/Release/AstraGram-v*-linux-${{ matrix.arch }}.zip
          retention-days: 7

      - name: Remove packer signing key.
        if: always()
        run: rm -f Telegram/SourceFiles/_other/packer_private.h
